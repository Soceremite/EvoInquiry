  <text x="720.0" y="656.4" font-size="24" fill="#34304B" text-anchor="middle" font-weight="bold">Stop writers → inspect dependencies → preview → apply within scope</text>
  <text x="64.0" y="66.0" font-size="39" fill="#34304B" text-anchor="start">Keep the evidence. Release the excess.</text>
  <text x="64.0" y="108.0" font-size="22" fill="#6A637D" text-anchor="start">Comparison records survive model consolidation.</text>
  <text x="1376.0" y="64.0" font-size="17" fill="#80758A" text-anchor="end">ARCHIVAL / 03</text>
  <text x="740.0" y="233.0" font-size="18" fill="#C7793A" text-anchor="middle">EVIDENCE CHECK</text>
  <text x="1175.0" y="186.0" font-size="19" fill="#276D59" text-anchor="middle">Validation-selected weights</text>
  <text x="80.0" y="576.0" font-size="20" fill="#6A637D" text-anchor="start">Logs remain outside disposable checkpoint artifacts.</text>
  <text x="80.0" y="753.0" font-size="22" fill="#6A637D" text-anchor="start">Integrity checks verify records. Research review assesses fairness and claims.</text>
