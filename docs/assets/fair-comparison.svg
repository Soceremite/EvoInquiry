  <rect x="80.0" y="152.0" width="1280.0" height="112.0" fill="#FFFFFF" stroke="#D7C8B8" stroke-width="2" rx="20" />
  <text x="720.0" y="202.9" font-size="27" fill="#34304B" text-anchor="middle" font-weight="bold">Shared evidence boundary</text>
  <text x="720.0" y="231.9" font-size="24" fill="#6A637D" text-anchor="middle">Data splits · strong baselines · fixed metrics · held-out evaluation</text>
  <rect x="82.5" y="349.0" width="365.0" height="176.0" fill="#DDF5E9" stroke="#419579" stroke-width="2" rx="20" />
  <text x="265.0" y="418.8" font-size="25" fill="#34304B" text-anchor="middle" font-weight="bold">Controlled</text>
  <text x="265.0" y="445.8" font-size="25" fill="#34304B" text-anchor="middle" font-weight="bold">contribution</text>
  <text x="265.0" y="472.8" font-size="22" fill="#6A637D" text-anchor="middle">Isolate the mechanism</text>
  <rect x="537.5" y="349.0" width="365.0" height="176.0" fill="#E5F3FB" stroke="#428EB0" stroke-width="2" rx="20" />
  <text x="720.0" y="419.4" font-size="24" fill="#34304B" text-anchor="middle" font-weight="bold">Equal resource</text>
  <text x="720.0" y="445.4" font-size="24" fill="#34304B" text-anchor="middle" font-weight="bold">budget</text>
  <text x="720.0" y="471.4" font-size="21" fill="#6A637D" text-anchor="middle">Declare caps &amp; account for cost</text>
  <rect x="992.5" y="349.0" width="365.0" height="176.0" fill="#EDE5FF" stroke="#7862E8" stroke-width="2" rx="20" />
  <text x="1175.0" y="419.4" font-size="24" fill="#34304B" text-anchor="middle" font-weight="bold">Tuned system</text>
  <text x="1175.0" y="445.4" font-size="24" fill="#34304B" text-anchor="middle" font-weight="bold">performance</text>
  <text x="1175.0" y="471.4" font-size="21" fill="#6A637D" text-anchor="middle">Disclose recipes &amp; search costs</text>
  <rect x="80.0" y="612.0" width="1280.0" height="108.0" fill="#FFFFFF" stroke="#D7C8B8" stroke-width="2" rx="20" />
  <text x="720.0" y="661.4" font-size="24" fill="#34304B" text-anchor="middle" font-weight="bold">Report individual runs, uncertainty, failures and protocol deviations</text>
  <text x="720.0" y="687.4" font-size="21" fill="#6A637D" text-anchor="middle">Choose repetition from variability, useful precision and the available budget.</text>
  <text x="64.0" y="66.0" font-size="39" fill="#34304B" text-anchor="start">Fairness starts with the question.</text>
  <text x="64.0" y="108.0" font-size="22" fill="#6A637D" text-anchor="start">Match the design to the claim you want the comparison to support.</text>
  <text x="1376.0" y="64.0" font-size="17" fill="#80758A" text-anchor="end">COMPARISON / 02</text>
