  <text x="720.0" y="674.0" font-size="23" fill="#6A637D" text-anchor="middle" font-weight="bold">Resume from verified project artifacts</text>
  <text x="64.0" y="66.0" font-size="39" fill="#34304B" text-anchor="start">Research evolves through evidence.</text>
  <text x="64.0" y="108.0" font-size="22" fill="#6A637D" text-anchor="start">Choose the next step from what the evidence supports — and what is still unresolved.</text>
  <text x="1376.0" y="64.0" font-size="17" fill="#80758A" text-anchor="end">WORKFLOW / 01</text>
  <text x="80.0" y="147.0" font-size="17" fill="#419579" text-anchor="start">01 / QUESTION</text>
  <text x="540.0" y="147.0" font-size="17" fill="#428EB0" text-anchor="start">02 / METHOD</text>
  <text x="1000.0" y="147.0" font-size="17" fill="#7862E8" text-anchor="start">03 / DESIGN</text>
  <text x="1000.0" y="415.0" font-size="17" fill="#428EB0" text-anchor="start">04 / EXPERIMENT</text>
  <text x="540.0" y="415.0" font-size="17" fill="#C7793A" text-anchor="start">05 / EVIDENCE</text>
  <text x="80.0" y="415.0" font-size="17" fill="#419579" text-anchor="start">06 / CLAIM</text>
  <text x="282.0" y="364.0" font-size="20" fill="#276D59" text-anchor="start">new questions</text>
  <text x="742.0" y="364.0" font-size="20" fill="#6246BF" text-anchor="start">revise &amp; retest</text>
  <text x="1202.0" y="364.0" font-size="20" fill="#6246BF" text-anchor="start">implement</text>
  <text x="720.0" y="738.0" font-size="21" fill="#6A637D" text-anchor="middle">Use one skill or a bounded workflow. Goals, review gates and resource limits stay in control.</text>
