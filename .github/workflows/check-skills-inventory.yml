name: Skills inventory check

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'docs/SKILLS_CATALOG.md'
      - 'README.md'
      - 'README_CN.md'
      - 'AGENT_GUIDE.md'
      - 'tools/check_skills_inventory.py'
      - 'tools/verify_evo_inquiry.py'
      - 'tools/skill_contracts.py'
      - 'tools/skill-contracts.json'
      - 'tools/publication_policy.py'
      - 'tools/publication-policy.json'
      - 'tests/test_codex_skill_mirror.py'
      - 'tests/test_evo_inquiry.py'
      - '.github/workflows/check-skills-inventory.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Check skill inventory drift
        run: python tools/check_skills_inventory.py
      - name: Check frozen skill contracts
        run: python tools/verify_evo_inquiry.py
      - name: Check Codex skill mirror semantics
        run: python -m pytest tests/test_codex_skill_mirror.py tests/test_evo_inquiry.py -q
