name: Test suite

permissions:
  contents: read

# Full pytest suite on Linux AND macOS. macOS matters: its stock /bin/bash is
# 3.2, where `set -u` + empty-array "${ARR[@]}" expansion aborts — a class of
# bug (e.g. smart_update_codex.sh --overlay handling) that Linux bash >= 4.4
# never surfaces. Tests needing unavailable environments skip themselves
# (Windows PowerShell tests skip off-Windows; MiniMax live tests skip without
# MINIMAX_API_KEY) — no curated exclude list.

on:
  pull_request:
    paths:
      # Not just tools/tests: test_codex_skill_mirror.py checks skills/ ↔ mirror
      # parity, and check_skills_inventory.py (invoked by mirror-adjacent tests)
      # reads docs/**, README*, AGENT_GUIDE.md — so changes there must retrigger.
      - 'tools/**'
      - 'tests/**'
      - 'mcp-servers/**'
      - 'skills/**'
      - 'templates/**'
      - 'docs/**'
      - 'README.md'
      - 'README_CN.md'
      - 'AGENT_GUIDE.md'
      - '.codex-plugin/**'
      - '.agents/plugins/**'
      - 'compatibility/**'
      - 'VERSION'
      - 'requirements-dev.txt'
      - 'requirements-governance.txt'
      - '.github/workflows/test-suite.yml'
  push:
    branches: [main, 'acceptance/**']
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'mcp-servers/**'
      - 'skills/**'
      - 'templates/**'
      - 'docs/**'
      - 'README.md'
      - 'README_CN.md'
      - 'AGENT_GUIDE.md'
      - '.codex-plugin/**'
      - '.agents/plugins/**'
      - 'compatibility/**'
      - 'VERSION'
      - 'requirements-dev.txt'
      - 'requirements-governance.txt'
      - '.github/workflows/test-suite.yml'
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install interactive test support
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y expect
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Show bash version (the macOS leg must be 3.2.x)
        run: bash --version | head -1
      - name: Run full test suite
        run: python -m pytest tests/ -q --junitxml=validation/ci/test-results.xml
      - name: Report actual pytest failures
        if: always()
        run: python tools/report_ci_failures.py validation/ci/test-results.xml

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        powershell: [powershell.exe, pwsh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify native Windows installer and local governance
        env:
          ARIS_TEST_POWERSHELL: ${{ matrix.powershell }}
        run: python -m pytest tests/test_install_aris_ps1.py tests/test_filesystem_doctor.py tests/test_windows_governance.py tests/test_portability_governance.py tests/test_ci_failure_annotations.py tests/test_research_guidance.py tests/test_comparison_evidence.py tests/test_comparison_archive.py tests/test_checkpoint_retention.py tests/test_literature_records.py tests/test_research_decisions.py tests/test_workflow_contract_versions.py tests/test_figure_evidence.py tests/test_run_state.py tests/test_research_control.py tests/test_experiment_block_reflection.py tests/test_execution_governance.py tests/test_problem_synthesis.py tests/test_research_handoff.py tests/test_research_events.py tests/test_research_memory.py tests/test_candidate_comparison.py tests/test_research_pilots.py tests/test_resource_budget.py tests/test_governed_queue.py tests/test_training_budget_clock.py tests/test_dispatch_monitor_repairs.py -q -rs --junitxml=validation/ci/test-results.xml
      - name: Report actual pytest failures
        if: always()
        run: python tools/report_ci_failures.py validation/ci/test-results.xml
