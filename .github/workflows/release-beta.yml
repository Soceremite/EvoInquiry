name: Publish release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install interactive test support
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y expect
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify release version and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os; from pathlib import Path; assert os.environ["RELEASE_TAG"] == "v" + Path("VERSION").read_text().strip()'
          python tools/verify_evo_inquiry.py
          python tools/check_skills_inventory.py
          python tools/sync_release_notes.py --check-file RELEASE_NOTES.md
      - name: Run regression suite
        run: python -m pytest tests/ -q -rs --junitxml=validation/ci/test-results.xml
      - name: Report actual pytest failures
        if: always()
        run: python tools/report_ci_failures.py validation/ci/test-results.xml

  publish:
    needs: [test, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build committed source assets
        run: python tools/build_beta_release.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ "$version" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          else
            release_flags=(--latest)
          fi
          gh release create "$RELEASE_TAG" \
            "dist/evo-inquiry-${version}.tar.gz" \
            "dist/evo-inquiry-${version}.zip" \
            dist/SHA256SUMS dist/release-manifest.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "EvoInquiry ${version}" --notes-file RELEASE_NOTES.md \
            "${release_flags[@]}"

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        powershell: [powershell.exe, pwsh]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify native Windows installer and local governance
        env:
          ARIS_TEST_POWERSHELL: ${{ matrix.powershell }}
        run: python -m pytest tests/test_install_aris_ps1.py tests/test_filesystem_doctor.py tests/test_windows_governance.py tests/test_portability_governance.py tests/test_ci_failure_annotations.py tests/test_research_guidance.py tests/test_comparison_evidence.py tests/test_comparison_archive.py tests/test_checkpoint_retention.py tests/test_literature_records.py tests/test_research_decisions.py tests/test_workflow_contract_versions.py tests/test_figure_evidence.py tests/test_run_state.py tests/test_research_control.py tests/test_execution_governance.py tests/test_problem_synthesis.py tests/test_research_handoff.py tests/test_research_events.py tests/test_research_memory.py tests/test_candidate_comparison.py tests/test_research_pilots.py -q -rs --junitxml=validation/ci/test-results.xml
      - name: Report actual pytest failures
        if: always()
        run: python tools/report_ci_failures.py validation/ci/test-results.xml
